schema_version: 1
decision_id: main-count-decision-v1
status: PROSPECTIVE_DRAFT_NOT_LOCKED
purpose: >-
  Select main-study replication counts from validation-only evidence without inspecting
  confirmatory method outcomes. This protocol does not authorize training.
execution_authorized: false
profile_target: experiment_profiles/main.yaml
inputs:
  exact_precision:
    path: results/processed/phase3_class_conditioned_assay_pilot.json
    publication_evidence: false
    conditions:
      - {condition_id: r1-class0-f1p00, metric: js_divergence}
      - {condition_id: r1-class5-f1p00, metric: js_divergence}
  equivalence_calibration:
    path: results/processed/equivalence_margin_calibration_v1.json
    required_joint_primary_admissible: true
    prospective_replacement_protocol: study/preregistration/equivalence_margin_calibration_v2.yaml
    replacement_rule: use_v2_only_after_frozen_protocol_and_passing_hash_verified_artifact
  original_seed_precision:
    path: results/processed/main_original_seed_precision_v1.json
    protocol: study/preregistration/main_original_seed_precision_v1.yaml
    protocol_id: main-original-seed-precision-v1
    resampling_unit: independently_trained_original_model_seed
    required_status: PASS
  candidate_seed_precision:
    path: results/processed/main_candidate_seed_precision_v1.json
    protocol: study/preregistration/main_candidate_seed_precision_v1.yaml
    protocol_id: main-candidate-seed-precision-v1
    resampling_unit: independently_initialized_candidate_unlearning_seed
    required_status: PASS
rules:
  original_seed_count:
    minimum: 5
    candidates: [5, 8, 10, 15, 20]
    selection: first_candidate_passing_every_frozen_primary_condition
  exact_retraining_seed_count:
    minimum: 15
    candidates: [15, 20, 25, 30]
    selection: max_of_minimum_and_largest_selected_exact_precision_count
  candidate_seed_count:
    minimum: 5
    candidates: [5, 8, 10, 15, 20]
    selection: first_candidate_passing_every_method_by_primary_condition
  precision:
    confidence_level: 0.95
    maximum_relative_interval_half_width: 0.20
    resampling_unit: independently_trained_model_seed
  equivalence_gate: >-
    No count decision is READY_FOR_FREEZE unless the independently calibrated joint-primary
    equivalence margin is admissible. An inadmissible margin cannot be repaired by increasing
    replication counts.
  no_peeking: >-
    Confirmatory test outputs, method rankings, and headline effect estimates are forbidden
    inputs. Candidate grids and thresholds may change only by a timestamped amendment before
    confirmatory execution.
decision_states: [READY_FOR_FREEZE, INSUFFICIENT_EVIDENCE, EQUIVALENCE_MARGIN_INADMISSIBLE]
artifact:
  path: results/processed/main_count_decision_v1.json
  immutable_after_profile_freeze: true
  required_protocol_sha256: true
  profile_update: human_reviewed_separate_change_only
