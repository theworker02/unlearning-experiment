finding: >-
  The first frozen input plan incorrectly set its own execution_authorized field to true,
  conflicting with the validation exporter’s fail-closed requirement that an input plan is
  never an execution authority.
impact: no training, prediction export, analysis, or method comparison occurred under the affected plan
remediation: >-
  Preserve the first amendment and plan unchanged; bind the protocol to a v2 frozen input
  plan whose execution_authorized field remains false, then issue a new freeze amendment.
