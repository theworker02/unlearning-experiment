e statistical protocol and matrix are frozen."}, {"title": "Evidence audit outcome", "body": "<div class='metrics'><div><b>1<\/b> gate-passing records<\/div><div><b>0<\/b> publication-eligible<\/div><div><b>0<\/b> verified claims<\/div><div><b>0<\/b> empirical figures<\/div><\/div><p class='warning'>Insufficient evidence.<\/p>", "notes": "This is a provenance outcome. It is not a negative result about any method.", "method": "Legacy records were re-evaluated without mutation under fail-closed gates.", "statistics": "No unlearning inference is performed.", "evidence": "/evidence/strongest/", "limitations": "Gate failures do not imply the original programs failed to execute.", "reviewer": "Why not repair old records? Doing so would invent missing raw evidence and violate immutability."}, {"title": "Reproducibility infrastructure", "body": "<ul><li>Stable sample IDs and immutable deletion manifests<\/li><li>Hashed checkpoints and schema-v2 predictions<\/li><li>SQLite experiment registry<\/li><li>Independent metric checks and scientific failure tests<\/li><li>Claim, figure, and release provenance gates<\/li><\/ul>", "notes": "Infrastructure capability does not substitute for empirical completion.", "method": "Derived catalogs are regenerated from raw artifacts.", "statistics": "Fifty deterministic randomized metric-reference fixtures pass.", "evidence": "/reproduce/", "limitations": "No clean flagship reproduction has occurred.", "reviewer": "Does the pipeline work end to end? A schema-v2 Digits integration test passes; flagship reproduction is absent."}, {"title": "Known limitations", "body": "<ul><li>No confirmatory or publication-eligible run<\/li><li>Seed convergence assessed in one pilot condition only<\/li><li>No frozen confirmatory statistical plan<\/li><li>No CIFAR or tabular corpus<\/li><li>No sequential empirical trajectory<\/li><li>Incomplete citation recheck and baseline fairness audit<\/li><\/ul>", "notes": "Do not minimize these blockers.", "method": "Limitations are drawn from gate and readiness records.", "statistics": "Not applicable.", "evidence": "/limitations/", "limitations": "This list itself may expand after external review.", "reviewer": "Is a paper currently justified? No."}, {"title": "Next falsifiable milestone", "body": "<p>Replicate the schema-v2 pilot across original-model seeds, a second deletion fraction, and high-loss deletion.<\/p><p>Then use the expanded pilot variance to freeze confirmatory endpoints, margins, and run counts.<\/p>", "notes": "This is planned work, clearly separated from completed artifacts.", "method": "Use predeclared deletion manifests and append-only experiment IDs.", "statistics": "Carry forward the frozen convergence diagnostic and estimate between-original-seed variance.", "evidence": "/results/", "limitations": "Pilot findings will remain non-confirmatory.", "reviewer": "Does k=15 generalize? No; convergence is condition-specific until replicated."}, {"title": "Verify and inspect", "body": "<pre><code>python -m pip install -e \".[dev]\"\nmake verify\nmake corpus\nunlearn-bench validate\nunlearn-bench status\nunlearn-bench evidence<\/code><\/pre>", "notes": "These commands verify infrastructure and current status; they do not reproduce a paper result.", "method": "Use the active environment documented by the repository.", "statistics": "No expected flagship interval exists.", "evidence": "/reproduce/", "limitations": "Full benchmark and flagship targets remain blocked.", "reviewer": "Can another lab reproduce a conclusion? Not yet, because no eligible conclusion exists."}, {"title": "Conclusion", "body": "<p>The counterfactual-fidelity question remains scientifically open in this repository.<\/p><p>The defensible outcome of Phase VI is a traceable statement of insufficiency and a concrete path to obtain the missing evidence.<\/p>", "notes": "End without implying method performance or novelty.", "method": "Conclusion is checked against research/conclusions.yaml.", "statistics": "No inferential conclusion.", "evidence": "/evidence/", "limitations": "Repository maturity remains v0.5.0.", "reviewer": "What did this show? It showed readiness boundaries, not unlearning effectiveness."}]}</script><script>const d=JSON.parse(document.getElementById('data').textContent),root=document.getElementById('slides');let i=0;d.slides.forEach((s,n)=>{const e=document.createElement('section');e.className='slide';e.id='slide-'+(n+1);e.innerHTML='<h1>'+s.title+'</h1>'+s.body+'<details><summary>Technical notes / defense mode</summary><p><b>Speaker notes:</b> '+s.notes+'</p><p><b>Method:</b> '+s.method+'</p><p><b>Statistics:</b> '+s.statistics+'</p><p><b>Limitations:</b> '+s.limitations+'</p><p><b>Reviewer question:</b> '+s.reviewer+'</p><p><a href="'+s.evidence+'">View evidence</a></p></details>';root.appendChild(e)});function show(n){i=Math.max(0,Math.min(d.slides.length-1,n));document.querySelectorAll('.slide').forEach((e,j)=>e.classList.toggle('active',j===i));counter.textContent=(i+1)+' / '+d.slides.length;progress.max=d.slides.length;progress.value=i+1;history.replaceState(null,'','#slide-'+(i+1))};prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);full.onclick=()=>document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(Number(location.hash.replace('#slide-',''))-1||0);</script></body></html>
