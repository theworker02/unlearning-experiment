experiment_id: phase3-fmnist-multi-original-assay-pilot-v1
maturity: PILOT
dataset:
  name: fashion_mnist
  root: data/raw
  validation_fraction: 0.1
  split_seed: 1729
  train_limit: 10000
  test_limit: 2500
model: {architecture: small_cnn, hidden_dim: 64}
training:
  device: auto
  optimizer: adamw
  epochs: 4
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  deterministic: true
original_seeds: [101, 102, 103, 104, 105]
exact_seeds: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
conditions:
  - {condition_id: r0-f0p005, strategy: random, seed: 3101, fraction: 0.005, manifest: deletion_manifests/phase3/fashion_mnist/r0-iid-f0.0050-m1-seed3101.json}
  - {condition_id: r0-f0p02, strategy: random, seed: 3101, fraction: 0.02, manifest: deletion_manifests/phase3/fashion_mnist/r0-iid-f0.0200-m1-seed3101.json}
  - {condition_id: r0-f0p05, strategy: random, seed: 3101, fraction: 0.05, manifest: deletion_manifests/phase3/fashion_mnist/r0-iid-f0.0500-m1-seed3101.json}
  - {condition_id: r0-f0p10, strategy: random, seed: 3101, fraction: 0.10, manifest: deletion_manifests/phase3/fashion_mnist/r0-iid-f0.1000-m1-seed3101.json}
statistics:
  alpha: 0.05
  target_power: 0.80
  simulation_repetitions: 2000
  simulation_seed: 73192
  candidate_separation_ratios: {start: 1.0, stop: 4.0, step: 0.05}
output_root: results/raw
