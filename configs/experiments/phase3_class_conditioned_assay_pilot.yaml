experiment_id: phase3-fmnist-class-conditioned-assay-pilot-v3
maturity: PILOT
dataset:
  name: fashion_mnist
  root: data/raw
  validation_fraction: 0.1
  split_seed: 1729
  train_limit: 10000
  test_limit: 2500
model: {architecture: small_cnn, hidden_dim: 64}
training:
  device: auto
  optimizer: adamw
  epochs: 4
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  deterministic: true
original_seeds: [101, 102, 103, 104, 105]
exact_seeds: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
conditions:
  - strategy: class_conditioned
    condition_id: r1-class0-f0p50
    seed: 3201
    fraction: 0.50
    target_class: 0
    manifest: deletion_manifests/phase3/fashion_mnist/r1-class0-f0.50-seed3201.json
  - strategy: class_conditioned
    condition_id: r1-class0-f1p00
    seed: 3201
    fraction: 1.0
    target_class: 0
    manifest: deletion_manifests/phase3/fashion_mnist/r1-class0-f1.00-seed3201.json
  - strategy: class_conditioned
    condition_id: r1-class5-f1p00
    seed: 3201
    fraction: 1.0
    target_class: 5
    manifest: deletion_manifests/phase3/fashion_mnist/r1-class5-f1.00-seed3201.json
statistics:
  alpha: 0.05
  target_power: 0.80
  simulation_repetitions: 2000
  simulation_seed: 73192
  candidate_separation_ratios: {start: 1.0, stop: 4.0, step: 0.05}
output_root: results/raw
